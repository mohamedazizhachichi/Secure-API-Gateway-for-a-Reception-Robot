version: "3.9"

# =============================================================================
# Secure API Gateway for Simulated Reception Robot — Docker Compose skeleton
# Sprint 3 prep. All secrets come from .env (never hardcoded — see ENF-05/08).
# =============================================================================

networks:
  backend:
    driver: bridge

volumes:
  kong_pg_data:
  keycloak_pg_data:
  redis_data:

services:

  # ---------------------------------------------------------------------
  # PostgreSQL — Kong's own datastore
  # ---------------------------------------------------------------------
  postgres-kong:
    image: postgres:16-alpine
    container_name: postgres-kong
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KONG_PG_DB}
      POSTGRES_USER: ${KONG_PG_USER}
      POSTGRES_PASSWORD: ${KONG_PG_PASSWORD}
    volumes:
      - kong_pg_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KONG_PG_USER} -d ${KONG_PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # PostgreSQL — Keycloak's own datastore (kept separate from Kong's DB
  # on purpose: blast-radius isolation between identity store and gateway)
  # ---------------------------------------------------------------------
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: postgres-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_PG_DB}
      POSTGRES_USER: ${KEYCLOAK_PG_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_PG_PASSWORD}
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_PG_USER} -d ${KEYCLOAK_PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # Kong bootstrap — runs DB migrations once, then exits (0 restart)
  # ---------------------------------------------------------------------
  kong-migrations:
    image: kong:3.7
    container_name: kong-migrations
    command: kong migrations bootstrap
    restart: on-failure
    depends_on:
      postgres-kong:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres-kong
      KONG_PG_DATABASE: ${KONG_PG_DB}
      KONG_PG_USER: ${KONG_PG_USER}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD}
    networks:
      - backend

  # ---------------------------------------------------------------------
  # Kong — API Gateway
  # Admin API bound to localhost only; proxy port is the public surface.
  # ---------------------------------------------------------------------
  kong:
    image: kong:3.7
    container_name: kong
    restart: unless-stopped
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
      postgres-kong:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres-kong
      KONG_PG_DATABASE: ${KONG_PG_DB}
      KONG_PG_USER: ${KONG_PG_USER}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD}
      KONG_PROXY_LISTEN: "0.0.0.0:${KONG_PROXY_PORT}"
      KONG_ADMIN_LISTEN: "127.0.0.1:${KONG_ADMIN_PORT}"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "${KONG_PROXY_PORT}:${KONG_PROXY_PORT}"
      - "127.0.0.1:${KONG_ADMIN_PORT}:${KONG_ADMIN_PORT}"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # Keycloak — Identity Provider (OAuth2 / OIDC)
  # start-dev is fine for a 6-week local demo; not for production.
  # ---------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/${KEYCLOAK_PG_DB}
      KC_DB_USERNAME: ${KEYCLOAK_PG_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_PG_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n' >&3 && grep 'UP' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------
  # Redis — backend store for Kong's rate-limiting plugin
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # Robot service — SIMULATED robot API (FastAPI). No physical robot.
  # ---------------------------------------------------------------------
  robot-service:
    build:
      context: ./services/robot
    container_name: robot-service
    restart: unless-stopped
    environment:
      SERVICE_PORT: ${ROBOT_SERVICE_PORT}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; urllib.request.urlopen(f'http://localhost:{os.environ[\"SERVICE_PORT\"]}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # Dashboard service — supervision API (FastAPI). Frontend is out of scope.
  # ---------------------------------------------------------------------
  dashboard-service:
    build:
      context: ./services/dashboard
    container_name: dashboard-service
    restart: unless-stopped
    environment:
      SERVICE_PORT: ${DASHBOARD_SERVICE_PORT}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      # ENF-06: robot target is parameterized, never hardcoded
      ROBOT_SERVICE_URL: ${ROBOT_SERVICE_URL}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; urllib.request.urlopen(f'http://localhost:{os.environ[\"SERVICE_PORT\"]}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
